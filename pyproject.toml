[project]
name = "kasbench-load-generator"
version = "0.1.0"
description = "KASBench Load Generator - FastAPI microservice managing Locust subprocess for variable HTTP load generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "locust>=2.32.0",
    "pydantic>=2.11.0",
    "httpx>=0.28.0",
    "pika>=1.4.1",
    "kr8s>=0.20.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "hypothesis>=6.120.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kasbench_load_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
